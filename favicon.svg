<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="100%" height="100%" fill="none">
  <defs>
    <!-- Background Gradient: Electric Rose-Crimson -->
    <linearGradient id="bgGrad" x1="16" y1="12" x2="112" y2="120" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FF2A6D"/>
      <stop offset="55%" stop-color="#FF1358"/>
      <stop offset="100%" stop-color="#C90035"/>
    </linearGradient>

    <!-- Inner Rim Specular Highlight for 3D Depth -->
    <linearGradient id="rimGlow" x1="64" y1="4" x2="64" y2="124" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.35"/>
      <stop offset="60%" stop-color="#ffffff" stop-opacity="0.05"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.12"/>
    </linearGradient>

    <!-- Bag Body Gradient: Ultra Clean Pristine White -->
    <linearGradient id="bagGrad" x1="64" y1="42" x2="64" y2="108" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#F1F5F9"/>
    </linearGradient>

    <!-- Lightning / 'M' Gradient: Electric Energy Gold to Orange-Red -->
    <linearGradient id="boltGrad" x1="50" y1="52" x2="78" y2="98" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FFE066"/>
      <stop offset="50%" stop-color="#FF9F1C"/>
      <stop offset="100%" stop-color="#FF385C"/>
    </linearGradient>

    <!-- Handle Gradient: Semi-translucent Frosted Glass -->
    <linearGradient id="handleGrad" x1="48" y1="20" x2="80" y2="46" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#FFE4EC" stop-opacity="0.8"/>
    </linearGradient>

    <!-- Drop Shadows -->
    <filter id="elevateShadow" x="-15%" y="-15%" width="130%" height="135%">
      <feDropShadow dx="0" dy="5" stdDeviation="4" flood-color="#550016" flood-opacity="0.32"/>
    </filter>

    <filter id="boltGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="2" flood-color="#FF758C" flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- 1. Squircle Canvas Base (Continuous iOS curvature) -->
  <rect x="4" y="4" width="120" height="120" rx="30" fill="url(#bgGrad)"/>
  <rect x="5.5" y="5.5" width="117" height="117" rx="28.5" fill="none" stroke="url(#rimGlow)" stroke-width="1.8"/>

  <!-- 2. Shopping Bag Handle (Smooth Arched Loop) -->
  <path d="M47 46 V32 C47 22.6 54.6 15 64 15 C73.4 15 81 22.6 81 32 V46" 
        stroke="url(#handleGrad)" stroke-width="6.5" stroke-linecap="round" fill="none"
        filter="url(#elevateShadow)"/>

  <!-- 3. Shopping Bag Body with Realistic Tapered Geometry & Soft Base Curve -->
  <path d="M30 46 C29.4 46 29 46.5 29.2 47.1 L36.2 101 C36.8 105.5 40.6 109 45.2 109 H82.8 C87.4 109 91.2 105.5 91.8 101 L98.8 47.1 C99 46.5 98.6 46 98 46 H30 Z" 
        fill="url(#bagGrad)" 
        filter="url(#elevateShadow)"/>

  <!-- Bag Top Rim / Fold Crease for Retail Bag realism -->
  <path d="M30 46 H98" stroke="#E2E8F0" stroke-width="2"/>

  <!-- Handle Anchor Eyelets (Metal studs) -->
  <circle cx="47" cy="46" r="3" fill="#FF1358"/>
  <circle cx="81" cy="46" r="3" fill="#FF1358"/>

  <!-- 4. Monogram 'M' + ⚡ Lightning Bolt Emblem (Fused E-Commerce Identity) -->
  <!-- Left Column of M -->
  <path d="M44 62 C44 59.8 45.8 58 48 58 H50 C51.7 58 53.2 59.2 53.5 60.9 L56 75 L52 76 L48 64 V92 C48 93.7 46.7 95 45 95 C43.3 95 42 93.7 42 92 V64 C42 62.9 42.9 62 44 62 Z" 
        fill="#FF1358"/>

  <!-- Right Column of M -->
  <path d="M84 62 C84 59.8 82.2 58 80 58 H78 C76.3 58 74.8 59.2 74.5 60.9 L72 75 L76 76 L80 64 V92 C80 93.7 81.3 95 83 95 C84.7 95 86 93.7 86 92 V64 C86 62.9 85.1 62 84 62 Z" 
        fill="#FF1358"/>

  <!-- Central Dynamic Lightning Bolt bridging the M apex (Speed & Flash Deals) -->
  <path d="M68 56 L55 76 H65 L61 97 L75 73 H64 L68 56 Z" 
        fill="url(#boltGrad)" 
        stroke="#FFFFFF" 
        stroke-width="1.2" 
        stroke-linejoin="round"
        filter="url(#boltGlow)"/>

  <!-- Delivery Speed Sparkle (Top Right Accent) -->
  <path d="M100 16 L102 24 L110 26 L102 28 L100 36 L98 28 L90 26 L98 24 Z" 
        fill="#FFE066" opacity="0.95"/>
</svg>